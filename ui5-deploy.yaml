# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json

specVersion: "3.1"
metadata:
  name: zcor001
type: application
builder:
  resources:
    excludes:
      - /test/**
      - /localService/**
  customTasks:
    - name: deploy-to-abap
      afterTask: generateCachebusterInfo
      configuration:
        target:
          url: https://my436957-api.s4hana.cloud.sap
          client: '080'
          authenticationType: reentranceTicket # SAML support for vscode
        app:
          name: ZCOR001
          package: ZCO_REPORT
          transport: FYRK900081
        exclude:
          - /test/